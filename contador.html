<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dézir — contador</title>
<style>
body{margin:0;font:16px/1.5 system-ui,-apple-system,sans-serif;background:#faf7f5;color:#1a1617;padding:24px 18px 60px}
h1{font-family:Georgia,serif;font-weight:500;margin:0 0 18px}
section{background:#fff;border:1px solid #ece6e1;border-radius:10px;padding:16px;margin-bottom:16px;max-width:560px}
h2{font-size:17px;margin:0 0 4px}
p.sub{color:#7a7174;margin:0 0 8px;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid #f1ece8}
.row span{font-size:15px}
.row img{height:22px}
button{min-height:44px;padding:0 20px;border-radius:99px;border:0;background:#c4122f;color:#fff;font:600 15px system-ui,sans-serif}
</style>
</head>
<body>
<h1>Contador Dézir</h1>

<section><h2>Pedidos concluídos</h2><p class="sub">Preencheram tudo e tocaram em “Concluir pedido pelo WhatsApp”.</p><div id="pedido"></div></section>
<section><h2>Dúvidas no WhatsApp</h2><p class="sub">Tocaram em “Tirar dúvida no WhatsApp”.</p><div id="duvida"></div></section>
<section><h2>WhatsApp do topo do site</h2><p class="sub">Tocaram no número da loja no topo.</p><div id="topo"></div></section>
<button onclick="location.reload()">Actualizar</button>

<script>
const G = "https://countapi.mileshilliard.com/api/v1/get/";
const hoje = new Date(Date.now() + 2*3600e3).toISOString().slice(0,10); // hora de Maputo
const badge = (k, t) => `<img alt="0" src="${G}${k}/shield?text=${encodeURIComponent(t)}&bgcolor=c4122f&style=flat&t=${Date.now()}" onerror="this.replaceWith('0')">`;
const linha = (rot, k, t) => `<div class="row"><span>${rot}</span>${badge(k, t)}</div>`;
const bloco = (id, base, t) => document.getElementById(id).innerHTML =
  linha("Hoje", base + "-dia-" + hoje, t) + linha("Total desde o início", base + "-total", t);
bloco("pedido", "dezir-mz-pedido", "pedidos"); bloco("duvida", "dezir-mz-duvida", "dúvidas"); bloco("topo", "dezir-mz-whatsapp-topo", "cliques");
</script>
</body>
</html>
