<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dézir — resultados</title>
<style>
body{margin:0;font:17px/1.45 system-ui,-apple-system,sans-serif;background:#faf7f5;color:#1a1617;padding:22px 16px 60px}
.box{max-width:520px;margin:0 auto}
h1{font-family:Georgia,serif;font-weight:500;font-size:28px;margin:0 0 16px;text-align:center}
.card{background:#fff;border:1px solid #ece6e1;border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{margin:0 0 6px;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#7a7174}
.l{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid #f1ece8}
.l:first-of-type{border-top:0}
.l span{font-size:16px}
.n{font-size:28px;font-weight:700;min-width:56px;text-align:right}
.n img{height:24px;vertical-align:middle}
.ok .n{color:#1f9d55}
.wa{background:#f4f9f6;border-radius:10px;padding:11px 12px;margin-top:6px;border-top:0}
.wa .n{color:#1f9d55}
.wa small{display:block;color:#7a7174;font-size:13px}
.resumo{margin:10px 0 0;color:#1f6b40;font-size:15px;text-align:center}
button{display:block;width:100%;max-width:520px;margin:0 auto;min-height:52px;border-radius:99px;border:0;background:#c4122f;color:#fff;font:600 17px system-ui,sans-serif}
</style>
</head>
<body><div class="box">
<h1>Resultados do site</h1>
<div id="cards"></div>
<button onclick="location.reload()">Actualizar</button>
</div>
<script>
const API = "https://countapi.mileshilliard.com/api/v1/get/";
const dia = d => new Date(Date.now() + 2*3600e3 - d*86400e3).toISOString().slice(0,10); // hora de Maputo
const PER = [["hoje","Hoje","-dia-" + dia(0)], ["ontem","Ontem","-dia-" + dia(1)], ["total","Desde o início","-total"]];
const LIN = [["visita","👀 Entraram no site",""], ["pedido","✅ Fizeram pedido","ok"], ["duvida","💬 Pediram ajuda (botão de dúvida)",""]];
document.getElementById("cards").innerHTML = PER.map(([p, tit]) => `<div class="card"><h2>${tit}</h2>
  ${LIN.map(([k, rot, c]) => `<div class="l ${c}"><span>${rot}</span><b class="n" id="${p}-${k}">…</b></div>`).join("")}
  <div class="l wa"><span>📲 Entraram em contacto pelo WhatsApp<small>Todos: pedidos + dúvidas + número do topo</small></span><b class="n" id="${p}-wa">…</b></div>
  <p class="resumo" id="${p}-r" hidden></p></div>`).join("");

const ler = key => fetch(API + key, {cache:"no-store"}).then(r => r.status === 404 ? {value:0} : r.json()).then(d => parseInt(d.value || 0, 10));
const imagem = (el, key) => el.innerHTML = `<img alt="0" src="${API}${key}/shield?text=+&bgcolor=1f9d55&style=flat&t=${Date.now()}" onerror="this.replaceWith('0')">`;
PER.forEach(([p, , suf]) => {
  const keys = {visita:"dezir-mz-visita"+suf, pedido:"dezir-mz-pedido"+suf, duvida:"dezir-mz-duvida"+suf, topo:"dezir-mz-whatsapp-topo"+suf};
  Promise.all(Object.values(keys).map(ler)).then(([v, o, d, t]) => {
    document.getElementById(p+"-visita").textContent = v;
    document.getElementById(p+"-pedido").textContent = o;
    document.getElementById(p+"-duvida").textContent = d;
    document.getElementById(p+"-wa").textContent = o + d + t;
    if (v > 0 && o <= v) { const r = document.getElementById(p+"-r"); r.hidden = false; r.textContent = `De cada 100 pessoas que entram, ${Math.round(o / v * 100)} fazem pedido.`; }
  }).catch(() => { // navegador bloqueou a leitura directa: mostra os números em imagem
    ["visita","pedido","duvida"].forEach(k => imagem(document.getElementById(p+"-"+k), keys[k]));
    imagem(document.getElementById(p+"-wa"), "dezir-mz-whatsapp-todos"+suf);
  });
});
</script>
</body>
</html>
