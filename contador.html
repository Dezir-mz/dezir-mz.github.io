<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dézir — resultados</title>
<style>
body{margin:0;font:17px/1.45 system-ui,-apple-system,sans-serif;background:#faf7f5;color:#1a1617;padding:22px 16px 60px}
.box{max-width:520px;margin:0 auto}
h1{font-family:Georgia,serif;font-weight:500;font-size:28px;margin:0 0 16px;text-align:center}
.card{background:#fff;border:1px solid #ece6e1;border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#7a7174}
.l{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid #f1ece8}
.l:first-of-type{border-top:0}
.l span{font-size:17px}
.n{font-size:30px;font-weight:700;min-width:60px;text-align:right}
.n img{height:24px;vertical-align:middle}
.ok .n{color:#1f9d55}
.resumo{margin:10px 0 0;padding:12px;border-radius:10px;background:#f4f9f6;color:#1f6b40;font-size:16px;text-align:center}
button{display:block;width:100%;max-width:520px;margin:0 auto;min-height:52px;border-radius:99px;border:0;background:#c4122f;color:#fff;font:600 17px system-ui,sans-serif}
</style>
</head>
<body><div class="box">
<h1>Resultados do site</h1>

<div class="card"><h2>Hoje</h2>
  <div class="l"><span>👀 Entraram no site</span><b class="n" data-k="visita" data-p="hoje">…</b></div>
  <div class="l ok"><span>✅ Fizeram pedido</span><b class="n" data-k="pedido" data-p="hoje">…</b></div>
  <div class="l"><span>💬 Pediram ajuda no WhatsApp</span><b class="n" data-k="duvida" data-p="hoje">…</b></div>
  <p class="resumo" id="r-hoje" hidden></p>
</div>

<div class="card"><h2>Desde o início</h2>
  <div class="l"><span>👀 Entraram no site</span><b class="n" data-k="visita" data-p="total">…</b></div>
  <div class="l ok"><span>✅ Fizeram pedido</span><b class="n" data-k="pedido" data-p="total">…</b></div>
  <div class="l"><span>💬 Pediram ajuda no WhatsApp</span><b class="n" data-k="duvida" data-p="total">…</b></div>
  <p class="resumo" id="r-total" hidden></p>
</div>

<button onclick="location.reload()">Actualizar</button>
</div>
<script>
const API = "https://countapi.mileshilliard.com/api/v1/get/";
const hoje = new Date(Date.now() + 2*3600e3).toISOString().slice(0,10); // hora de Maputo
const chave = (k, p) => "dezir-mz-" + k + (p === "hoje" ? "-dia-" + hoje : "-total");
const vals = {hoje:{}, total:{}};
const resumo = p => { const v = vals[p].visita, o = vals[p].pedido; const el = document.getElementById("r-" + p);
  if (v > 0 && o != null) { el.hidden = false; el.textContent = `De cada 100 pessoas que entram, ${Math.round(o / v * 100)} fazem pedido.`; } };
document.querySelectorAll("[data-k]").forEach(el => { const k = el.dataset.k, p = el.dataset.p, key = chave(k, p);
  fetch(API + key, {cache:"no-store"}).then(r => r.status === 404 ? {value:0} : r.json())
    .then(d => { const n = parseInt(d.value || 0, 10); el.textContent = n; vals[p][k] = n; resumo(p); })
    .catch(() => { // se o navegador bloquear a leitura directa, mostra o número em imagem
      el.innerHTML = `<img alt="0" src="${API}${key}/shield?text=+&bgcolor=c4122f&style=flat&t=${Date.now()}" onerror="this.replaceWith('0')">`; });
});
</script>
</body>
</html>
